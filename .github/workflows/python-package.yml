name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the linters
        run: python -m pip install flake8 bandit
      - name: Stop the build on syntax errors and undefined names
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Report the other findings without failing
        run: flake8 . --count --exit-zero --statistics
      - name: Test security
        run: bandit -r lrtree

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and its test dependencies
        run: python -m pip install -e ".[test]"
      - name: Test with coverage and pytest
        run: |
          coverage run --source lrtree/ -m pytest
          coverage report
          coverage xml
      - name: Upload the coverage report
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and the documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build the documentation
        run: sphinx-build -b html docs/source docs/build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/build/html

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the distributions
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    # Same as before the rewrite: every push to master uploads the version of the package to PyPI;
    # --skip-existing makes it a no-op when the version was not bumped
    needs: [lint, test, docs, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          python -m pip install twine
          twine upload --skip-existing --config-file .pypirc --repository pypi dist/*
